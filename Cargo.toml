[package]
name = "speed-test-rs"
version = "0.1.0"
edition = "2024"
authors = ["Mohammad Ishrak Abedin"]
description = "A modern, beautiful TUI for measuring Internet speed, jitter, latency, and packet loss"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
rand = "0.10.3"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
